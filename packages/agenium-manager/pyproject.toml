[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agenium-manager"
dynamic = ["version"]
description = "The Agenium manager: installs Agenium apps into their own environments and runs them. Early stage."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "agenium-dev" }]
classifiers = [
    "Development Status :: 1 - Planning",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = ["agenium-sdk>=0.0.1"]

[project.scripts]
agenium-manager = "agenium_manager.cli:main"

[project.urls]
Homepage = "https://github.com/agenium-dev/agenium"
Source = "https://github.com/agenium-dev/agenium/tree/main/packages/agenium-manager"

[tool.uv.sources]
agenium-sdk = { workspace = true }

[tool.hatch.version]
path = "src/agenium_manager/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/agenium_manager"]

[dependency-groups]
dev = ["pytest>=8"]
