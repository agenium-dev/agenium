; The standard agent node's supervisor, the same on every node. Its one program
; is the node's service manager, which keeps a program in the included folder
; for each service the agent's gate places on this node and none for any other.
; The entrypoint starts the supervisor in the agent's root, so the manager runs
; there.
[unix_http_server]
file=/tmp/agent-box-supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/agent-box-supervisord.pid
childlogdir=/tmp

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/agent-box-supervisor.sock

[include]
files=/tmp/agent-box-services/*.conf

[program:node]
command=capabilities node run --supervisor /tmp/agent-box-services --every 60
autostart=true
autorestart=true
startsecs=3
startretries=100
stopsignal=TERM
stopwaitsecs=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
priority=10
