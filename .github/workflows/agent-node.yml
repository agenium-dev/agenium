name: agent-node

# The standard agent node image. A change to it is built and checked on every
# pull request and push to main; it is published by pushing the tag
# agent-node/v<version> on a commit whose images/agent-node/VERSION matches it,
# as ghcr.io/agenium-dev/agent-node:<version> and :latest.
on:
  push:
    branches: [main]
    paths:
      - "images/agent-node/**"
      - ".github/workflows/agent-node.yml"
    tags:
      - "agent-node/v*"
  pull_request:
    paths:
      - "images/agent-node/**"
      - ".github/workflows/agent-node.yml"

permissions:
  contents: read

env:
  IMAGE: ghcr.io/agenium-dev/agent-node

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Read the version
        id: version
        env:
          REF: ${{ github.ref }}
          TAG: ${{ github.ref_name }}
        run: |
          version="$(tr -d '[:space:]' < images/agent-node/VERSION)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$REF" == refs/tags/agent-node/v* ]]; then
            if [ "${TAG#agent-node/v}" != "$version" ]; then
              echo "the tag names ${TAG#agent-node/v}, images/agent-node/VERSION holds $version" >&2
              exit 1
            fi
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: docker build --pull -t "$IMAGE:candidate" images/agent-node

      - name: Check the tools are in it
        run: |
          docker run --rm --entrypoint bash "$IMAGE:candidate" -c '
            set -e
            uv --version
            python3 --version
            uv python find 3.13
            claude --version
            codex --version
            supervisord --version
            capabilities help > /dev/null
            deployment help > /dev/null
            test -x /opt/agent/entrypoint.sh
            test -z "$(ls -A /app | grep -v "^capabilities$")"
          '

      - name: Check it waits idle and healthy with no agent
        run: |
          docker run -d --name agent-node-idle "$IMAGE:candidate"
          for _ in $(seq 1 60); do
            status="$(docker inspect -f '{{.State.Status}} {{.State.Health.Status}}' agent-node-idle)"
            if [ "$status" = "running healthy" ] && docker logs agent-node-idle 2>&1 | grep -q '\[entrypoint\] idle:'; then
              docker logs agent-node-idle
              exit 0
            fi
            case "$status" in running*) sleep 5 ;; *) break ;; esac
          done
          docker logs agent-node-idle
          docker inspect -f '{{json .State}}' agent-node-idle
          exit 1

      - name: Publish
        if: steps.version.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          printf '%s' "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker tag "$IMAGE:candidate" "$IMAGE:$VERSION"
          docker tag "$IMAGE:candidate" "$IMAGE:latest"
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:latest"
